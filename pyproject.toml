[project]
name = "snakeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "gymnasium[other]>=1.2.0",
    "moviepy==1.0.3",
    "numpy>=2.3.3",
    "pygame>=2.6.1",
    "sb3-contrib>=2.7.0",
    "stable-baselines3[extra]>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "tensorboard>=2.20.0",
]

[project.scripts]
snakeai = "snakeai.main:cli"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
