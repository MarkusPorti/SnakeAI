[project]
name = "snakeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.0",
    "numpy>=2.3.3",
    "pygame>=2.6.1",
    "stable-baselines3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
snakeai = "snakeai:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
